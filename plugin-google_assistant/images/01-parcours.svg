<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" width="940" height="270" role="img" aria-label="Parcours complet de création et de liaison de l’application Google" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Parcours complet de création et de liaison de l’application Google</title>
<rect width="940" height="270" rx="12" fill="#f6f7f9"/>
<text x="470" y="38" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="middle">Parcours complet : de la console Google au compte lié</text><rect x="20" y="70" width="156" height="124" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><circle cx="42" cy="92" r="13" fill="#e8710a"/><text x="42" y="97" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="62" y="97" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Google Cloud</text><text x="98.0" y="134" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">Créer le projet</text><text x="98.0" y="153" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">Activer l'API</text><text x="98.0" y="172" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">Google Assistant</text><text x="98.0" y="220" font-size="12" fill="#59636e" font-weight="normal" text-anchor="middle">Console Google</text><path d="M180 132 h20" stroke="#59636e" stroke-width="2"/><path d="M200 126 l8 6 l-8 6 z" fill="#59636e"/><rect x="206" y="70" width="156" height="124" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><circle cx="228" cy="92" r="13" fill="#e8710a"/><text x="228" y="97" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="248" y="97" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Auth Platform</text><text x="284.0" y="134" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">Marque, audience,</text><text x="284.0" y="153" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">client « Application</text><text x="284.0" y="172" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">Web »</text><text x="284.0" y="220" font-size="12" fill="#59636e" font-weight="normal" text-anchor="middle">Console Google</text><path d="M366 132 h20" stroke="#59636e" stroke-width="2"/><path d="M386 126 l8 6 l-8 6 z" fill="#59636e"/><rect x="392" y="70" width="156" height="124" rx="10" fill="#eaf7ee" stroke="#2fb344" stroke-width="1.5"/><circle cx="414" cy="92" r="13" fill="#e8710a"/><text x="414" y="97" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="434" y="97" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Jeedom</text><text x="470.0" y="134" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">Client ID + Secret</text><text x="470.0" y="153" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">puis « Se connecter</text><text x="470.0" y="172" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">avec Google »</text><text x="470.0" y="220" font-size="12" fill="#59636e" font-weight="normal" text-anchor="middle">Jeedom</text><path d="M552 132 h20" stroke="#59636e" stroke-width="2"/><path d="M572 126 l8 6 l-8 6 z" fill="#59636e"/><rect x="578" y="70" width="156" height="124" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><circle cx="600" cy="92" r="13" fill="#e8710a"/><text x="600" y="97" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="620" y="97" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Google</text><text x="656.0" y="134" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">Choix du compte</text><text x="656.0" y="153" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">et consentement</text><text x="656.0" y="172" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">aux autorisations</text><text x="656.0" y="220" font-size="12" fill="#59636e" font-weight="normal" text-anchor="middle">Google</text><path d="M738 132 h20" stroke="#59636e" stroke-width="2"/><path d="M758 126 l8 6 l-8 6 z" fill="#59636e"/><rect x="764" y="70" width="156" height="124" rx="10" fill="#eaf7ee" stroke="#2fb344" stroke-width="1.5"/><circle cx="786" cy="92" r="13" fill="#e8710a"/><text x="786" y="97" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="806" y="97" font-size="13.5" fill="#1f2328" font-weight="bold" text-anchor="start">Jeedom</text><text x="842.0" y="134" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">« Lier le compte »</text><text x="842.0" y="153" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">→ compte lié</text><text x="842.0" y="172" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">+ synchronisation</text><text x="842.0" y="220" font-size="12" fill="#59636e" font-weight="normal" text-anchor="middle">Jeedom</text><text x="470" y="250" font-size="13" fill="#59636e" font-weight="normal" text-anchor="middle">Phases 1 et 2 : une seule fois, dans votre propre projet Google Cloud. Phases 3 à 5 : environ une minute.</text>
</svg>
