<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-label="Écran Lier ce compte Google à Jeedom" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Écran « Lier ce compte Google à Jeedom ? »</title><rect x="0" y="0" width="600" height="470" rx="12" fill="#1b1e23"/><rect x="70" y="30" width="460" height="410" rx="10" fill="#24272e"/><rect x="70" y="30" width="460" height="4" fill="#4a90e2"/><image href="data:image/png;base64," x="268" y="58" width="64" height="64"/><text x="300" y="158" font-size="19" fill="#e6e6e6" font-weight="bold" text-anchor="middle">Lier ce compte Google à Jeedom ?</text><text x="100" y="196" font-size="14.5" fill="#c6c8cc" font-weight="normal" text-anchor="start">Le plugin Google Assistant pourra envoyer des requêtes</text><text x="100" y="219" font-size="14.5" fill="#c6c8cc" font-weight="normal" text-anchor="start">à Google Assistant en votre nom, et donc piloter les</text><text x="100" y="242" font-size="14.5" fill="#c6c8cc" font-weight="normal" text-anchor="start">appareils domotiques associés à ce compte Google.</text><text x="100" y="265" font-size="14.5" fill="#c6c8cc" font-weight="normal" text-anchor="start">Les identifiants restent stockés uniquement sur ce</text><text x="100" y="288" font-size="14.5" fill="#c6c8cc" font-weight="normal" text-anchor="start">serveur Jeedom. Vous pourrez retirer cet accès à tout</text><text x="100" y="311" font-size="14.5" fill="#c6c8cc" font-weight="normal" text-anchor="start">moment depuis myaccount.google.com/permissions.</text><rect x="100" y="352" width="104" height="40" rx="6" fill="none" stroke="#454952"/><text x="152" y="377" font-size="14.5" fill="#c6c8cc" font-weight="bold" text-anchor="middle">Refuser</text><rect x="209" y="347" width="150" height="50" rx="10" fill="none" stroke="#e8710a" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="214" y="352" width="140" height="40" rx="6" fill="#4a90e2"/><text x="284" y="377" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="middle">Lier le compte</text><circle cx="378" cy="372" r="13" fill="#e8710a"/><text x="378" y="377" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="300" y="425" font-size="12" fill="#8b8f97" font-weight="normal" text-anchor="middle">Page servie par votre Jeedom, après le consentement Google</text></svg>
