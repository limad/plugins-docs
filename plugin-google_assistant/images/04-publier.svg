<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="Publier l’application pour éviter l’expiration des identifiants au bout de 7 jours" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Publier l’application pour éviter l’expiration des identifiants au bout de 7 jours</title>
<rect width="760" height="270" rx="12" fill="#f6f7f9"/>
<rect x="20" y="20" width="720" height="230" rx="10" fill="#ffffff" stroke="#d0d4da"/><path d="M20 30 a10 10 0 0 1 10 -10 h700 a10 10 0 0 1 10 10 v24 h-720 z" fill="#eceef1"/><circle cx="38" cy="37" r="5" fill="#ff5f57"/><circle cx="54" cy="37" r="5" fill="#febc2e"/><circle cx="70" cy="37" r="5" fill="#28c840"/><rect x="90" y="27" width="630" height="20" rx="10" fill="#ffffff" stroke="#d0d4da"/><text x="104" y="41" font-size="12" fill="#59636e">console.cloud.google.com/auth/audience</text><text x="50" y="82" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start">Statut de publication</text><rect x="50" y="98" width="86" height="26" rx="13" fill="#fef7e0" stroke="#f9ab00"/><text x="93" y="116" font-size="13" fill="#8a5a00" font-weight="bold" text-anchor="middle">En test</text><text x="150" y="108" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">Seuls les utilisateurs de test peuvent se connecter,</text><text x="150" y="126" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">et l'autorisation expire au bout de 7 jours.</text><rect x="45" y="141" width="200" height="46" rx="23" fill="none" stroke="#e8710a" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="50" y="146" width="190" height="36" rx="18" fill="#1a73e8" stroke="#1a73e8"/><text x="145.0" y="169.0" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">Publier l'application</text><circle cx="262" cy="164" r="13" fill="#e8710a"/><text x="262" y="169" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="222" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Type d'utilisateur : Externe</text><text x="250" y="222" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">— aucune validation Google nécessaire pour votre usage personnel</text>
